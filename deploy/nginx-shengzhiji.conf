# 生职迹 Career Trail · Nginx 站点配置（careervault.cn）
# 安装位置：/etc/nginx/sites-available/shengzhiji.conf
# 由 deploy/server-setup.sh 自动完成安装，无需手工操作。
#
# 结构：Nginx 终结 80/443（HTTPS 由 certbot 自动补齐），
#       反向代理到本机 8000 端口的 uvicorn（systemd 服务 shengzhiji）。

server {
    listen 80;
    listen [::]:80;
    server_name careervault.cn www.careervault.cn;

    # 简历导入会传 PDF / Word 文件，放宽上传上限
    client_max_body_size 20m;

    # 静态资源与 API 全部交给 FastAPI（它同时服务 webapp/ 前端产物）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;   # AI 提炼 / 简历生成可能较慢
        proxy_send_timeout 120s;
    }

    # 文本类响应压缩（JS/CSS/HTML）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
